<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Випадкове зображення</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }
        .image-container {
            margin: 20px auto;
            max-width: 500px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        img {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <h1>Випадкове зображення</h1>
    
    <div class="image-container">
        <img id="random-img" src="/img/1.jpg" alt="Завантаження зображення...">
    </div>

    <button id="refresh-btn">Показати інше</button>

    <script>
        const imgElement = document.getElementById('random-img');
        const buttonElement = document.getElementById('refresh-btn');

        function showRandomImage() {
            const randomNumber = Math.floor(Math.random() * 9) + 1;
            
            imgElement.src = `${randomNumber}.jpg`;
            imgElement.alt = `Зображення №${randomNumber}`;
        }

        showRandomImage();

        buttonElement.addEventListener('click', showRandomImage);
    </script>
</body>
</html>
