<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Калькулятор</title>
    <!-- Підключаємо зовнішній файл стилів -->
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <div class="calculator-card">
        <h2>Калькулятор</h2>
        
        <div class="inputs-group">
            <input type="number" id="num1" placeholder="Число А">
            <input type="number" id="num2" placeholder="Число Б">
        </div>

        <div class="buttons-grid">
            <button onclick="calculate('add')">+</button>
            <button onclick="calculate('subtract')">-</button>
            <button onclick="calculate('multiply')">*</button>
            <button onclick="calculate('divide')">/</button>
        </div>

        <div class="result-box" id="result">Результат з'явиться тут</div>
    </div>

    <script src="main.js"></script>
</body>
</html>
